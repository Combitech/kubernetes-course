global:
  security:
    allowInsecureImages: true
    
grafana:
  global:
    imagePullSecrets: []
  config:
    useGrafanaIniFile: true
    grafanaIniSecret: 'grafana-config'
  dashboardsProvider:
    enabled: true
  dashboardsConfigMaps:
    - configMapName: 'cm-grafana-dashboards'
      fileName: 'dashboard.json'
  datasources:
    secretName: 'grafana-config'
  image:
    registry: combikubepublic.azurecr.io

influxdb:
  global:
    imagePullSecrets: []
    imageRegistry: combikubepublic.azurecr.io
  auth:
    admin:
      username: 'influx'
      password: 'influxdbpassword'
      token: 'tokenStringForInfluxDB'

rabbitmq:
  global:
    imagePullSecrets: []
    imageRegistry: combikubepublic.azurecr.io
  auth:
    username: 'guest'
    password: 'guest'
    erlangCookie: 'CfRrIxhHEZk0XUh9LdwDJTWa6woVEush'
  extraConfiguration: |-
    default_vhost = /
    default_permissions.configure = .*
    default_permissions.read = .*
    default_permissions.write = .*
